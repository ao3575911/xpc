[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xpc"
version = "0.2.0"
description = "hypothesis → protocol → result — experiment contract CLI"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "ao3575911" }]
keywords = ["json-schema", "research", "experiments", "cli"]
dependencies = [
  "jsonschema>=4.22",
  "referencing>=0.35",
]
[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
xpc = "xpc.cli:main"

[project.urls]
Homepage = "https://github.com/ao3575911/xpc"
Repository = "https://github.com/ao3575911/xpc"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
xpc = ["schemas/*.schema.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
