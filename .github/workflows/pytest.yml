name: pytest
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: xpc validate examples/gdk9-conserve-vs-naive examples/gdk9-keysuite-compose examples/gdk9-egglog-dr-bridge
      - run: pytest -q
